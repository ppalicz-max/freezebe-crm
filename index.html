<title>Freezbee Sales CRM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
/* Layout: phone-width app column, black/pink Freezbee identity, commission "ticket" as the one bold element, fixed bottom nav + floating Log order. */
:root{
  --bg:#F7EDF2; --surface:#FFFFFF; --ink:#000000; --soft:#6E5C66; --line:#EBD9E2;
  --pink:#E8AFCB; --accent:#A8336E;
  --ticket-bg:#000000; --ticket-fg:#FFFFFF; --ticket-hi:#EDB0CD; --ticket-soft:#BCA6B2; --ticket-track:rgba(255,255,255,.16);
  --good:#1E7A4B; --warn:#8F5B00; --bad:#C0352A;
  --st-lead:#6E5C66; --st-contacted:#2D63A6; --st-tasting:#8F5B00; --st-negotiating:#7A3FA8; --st-customer:#1E7A4B; --st-lost:#8E8389;
  --fab-bg:#000000; --fab-fg:#EDB0CD; --overlay:rgba(30,10,20,.5);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0A0C; --surface:#1B1519; --ink:#F8EAF1; --soft:#B7A0AC; --line:#30262C;
  --pink:#EDB0CD; --accent:#F0B6D2;
  --ticket-bg:#EDB0CD; --ticket-fg:#000000; --ticket-hi:#000000; --ticket-soft:#5E3B4C; --ticket-track:rgba(0,0,0,.16);
  --good:#62C893; --warn:#E6B354; --bad:#FF7D70;
  --st-lead:#B7A0AC; --st-contacted:#7FB0F0; --st-tasting:#E6B354; --st-negotiating:#C69AF0; --st-customer:#62C893; --st-lost:#8E8389;
  --fab-bg:#EDB0CD; --fab-fg:#000000; --overlay:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0A0C; --surface:#1B1519; --ink:#F8EAF1; --soft:#B7A0AC; --line:#30262C;
  --pink:#EDB0CD; --accent:#F0B6D2;
  --ticket-bg:#EDB0CD; --ticket-fg:#000000; --ticket-hi:#000000; --ticket-soft:#5E3B4C; --ticket-track:rgba(0,0,0,.16);
  --good:#62C893; --warn:#E6B354; --bad:#FF7D70;
  --st-lead:#B7A0AC; --st-contacted:#7FB0F0; --st-tasting:#E6B354; --st-negotiating:#C69AF0; --st-customer:#62C893; --st-lost:#8E8389;
  --fab-bg:#EDB0CD; --fab-fg:#000000; --overlay:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tap{transition:opacity .12s}.tap:active{opacity:.6}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.num{font-variant-numeric:tabular-nums}
.d{font-family:var(--f-display);font-stretch:72%;font-weight:800;line-height:.95;letter-spacing:-.005em;font-variant-numeric:tabular-nums}

#main{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(170px + env(safe-area-inset-bottom,0px))}
.hdr{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 16px}
.hdr-txt{min-width:0}
.brand{font-family:var(--f-display);font-stretch:62%;font-weight:900;font-size:15px;letter-spacing:.06em;color:var(--accent)}
.hdr h1{font-family:var(--f-display);font-stretch:68%;font-weight:900;font-size:46px;line-height:.92;text-transform:uppercase;margin:4px 0 0;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--soft);font-size:14px}
.hdr-r{display:flex;align-items:center;gap:10px;flex-shrink:0;padding-bottom:4px}
.status{font-size:12px;color:var(--soft);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.status svg.i{width:14px;height:14px}
.status.err{color:var(--bad);font-weight:600}

.sec{margin-top:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.sec-h h2{font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:26px;margin:0;line-height:1}
.sec-h .aside{font-size:13px;color:var(--soft)}
.card{background:var(--surface);border-radius:18px;overflow:hidden}
.empty{background:var(--surface);border-radius:18px;padding:18px;color:var(--soft);font-size:15px}
.note{color:var(--soft);font-size:13px;margin:10px 4px 0}
.banner{background:var(--surface);border-left:4px solid var(--bad);border-radius:12px;padding:14px 16px;margin-top:8px}
.banner b{display:block;margin-bottom:4px}

/* ticket */
.ticket{background:var(--ticket-bg);color:var(--ticket-fg);border-radius:24px;position:relative;overflow:hidden}
.t-top,.t-bot{padding:20px}
.t-lbl{margin:0;font-size:14px;color:var(--ticket-soft)}
.t-big{margin:10px 0 0;font-family:var(--f-display);font-stretch:66%;font-weight:900;font-size:66px;line-height:.9;color:var(--ticket-hi);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.bar{height:8px;border-radius:99px;background:var(--ticket-track);overflow:hidden;margin-top:18px}
.bar>i{display:block;height:100%;background:var(--ticket-hi);border-radius:99px;transition:width .4s}
.bar-txt{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ticket-soft);margin-top:8px}
.perf{position:relative;height:0;margin:0 20px;border-top:2px dashed var(--ticket-track)}
.perf::before,.perf::after{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--bg);top:-14px}
.perf::before{left:-33px}.perf::after{right:-33px}
.t-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.t-stat b{display:block;font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.t-stat span{display:block;font-size:12px;color:var(--ticket-soft);margin-top:4px}
.mix{display:flex;gap:2px;height:10px;border-radius:99px;overflow:hidden;background:var(--ticket-track);margin-top:20px}
.mix>i{display:block;height:100%;background:var(--ticket-hi)}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;margin-top:12px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px;min-width:0}
.legend .dot{width:10px;height:10px;border-radius:50%;background:var(--ticket-hi);flex-shrink:0}
.legend .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ticket-soft)}
.legend b{font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}

.start{background:var(--surface);border-radius:20px;padding:20px;margin-bottom:16px}
.start h2{font-family:var(--f-display);font-stretch:70%;font-weight:900;font-size:30px;line-height:1;margin:0;text-transform:uppercase}
.start p{color:var(--soft);margin:8px 0 16px}

/* rows */
.row{display:flex;align-items:center;gap:8px;padding-right:12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 0 12px 14px;text-align:left}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rt{min-width:0;flex:1}
.rt b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{display:block;font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span.late{color:var(--bad)}.rt span.soon{color:var(--warn)}
.callbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);flex-shrink:0;text-decoration:none}
.callbtn svg.i{width:18px;height:18px}
.earn{font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:22px;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.paid{font-size:12px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap}
.paid.yes{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.paid.no{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.orow{display:flex;align-items:center;gap:12px;padding-right:14px;border-top:1px solid var(--line)}
.orow:first-child{border-top:0}
.orow-main{flex:1;min-width:0;text-align:left;padding:12px 0 12px 14px}
.orow-main b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow-main span{display:block;font-size:14px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}

/* chips & buttons */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{padding:8px 15px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0;background:var(--surface);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--bg)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border-radius:16px;font-weight:600;font-size:16px;text-decoration:none}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-pink{background:var(--pink);color:#000}
.btn-plain{background:var(--surface);color:var(--ink)}
.btn-line{border:1px solid var(--line);background:var(--surface)}
.btn-danger{border:1px solid var(--bad);color:var(--bad)}
.btn-danger.armed{background:var(--bad);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:99px;font-weight:600;background:var(--surface);text-decoration:none;font-size:15px}
.pill svg.i{width:16px;height:16px}
.pill-ink{background:var(--ink);color:var(--bg)}

/* search */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;color:var(--soft)}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:12px 0;outline:none;color:var(--ink);font-size:16px}

/* client detail */
.back-row{display:flex;justify-content:space-between;align-items:center;padding-top:14px}
.back{display:flex;align-items:center;gap:2px;color:var(--soft);font-weight:500;padding:8px 4px}
.cd-meta{display:flex;align-items:center;gap:8px;color:var(--soft);font-size:14px;margin-top:10px}
.cd-meta svg.i{width:16px;height:16px}
.cd-name{font-family:var(--f-display);font-stretch:68%;font-weight:900;font-size:44px;line-height:.92;margin:8px 0 0;text-transform:uppercase;overflow-wrap:anywhere;text-wrap:balance}
.cd-contact{margin-top:8px;color:var(--soft)}
.contact-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.cline{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:6px 6px 6px 14px}
.cline .val{flex:1;min-width:0;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.cline .mini{padding:8px 12px;border-radius:10px;font-size:14px;font-weight:600;background:var(--bg);text-decoration:none;white-space:nowrap}
.cline .mini.go{background:var(--good);color:var(--bg)}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;background:var(--surface);border-radius:18px;padding:16px}
.stats3 b{display:block;font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:24px;line-height:1;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.stats3 b.acc{color:var(--accent)}
.stats3 span{display:block;font-size:12px;color:var(--soft);margin-top:4px}
.fu{background:var(--surface);border-radius:18px;padding:16px}
.fu-top{display:flex;align-items:center;gap:12px}
.fu-top .rt span.late{color:var(--bad)}
.input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;outline:none;color:var(--ink);font-size:16px;min-height:48px}
input[type=date].input{-webkit-appearance:none;appearance:none;display:block}
textarea.input{resize:vertical;min-height:84px}
.mini-btn{padding:8px 12px;border-radius:99px;font-size:14px;font-weight:600;background:var(--bg)}
.act{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.act .rt b{white-space:normal}
.act .txt{font-size:14px;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.x{color:var(--soft);align-self:flex-start;padding:2px}
.x svg.i{width:16px;height:16px}

/* orders */
.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;padding:4px}
.monthnav button{padding:12px}
.monthnav span{font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:24px;text-transform:capitalize}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.tile{background:var(--surface);border-radius:16px;padding:14px 16px;min-width:0}
.tile b{display:block;font-family:var(--f-display);font-stretch:68%;font-weight:800;font-size:30px;line-height:1;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.tile b.acc{color:var(--accent)}.tile b.warn{color:var(--warn)}
.tile span{display:block;font-size:13px;color:var(--soft);margin-top:4px}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pipe button{background:var(--surface);border-radius:14px;padding:12px;text-align:left;border-left:4px solid var(--c)}
.pipe b{display:block;font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:28px;line-height:1}
.pipe span{display:block;font-size:13px;color:var(--soft);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* team */
.team-wrap{overflow-x:auto;background:var(--surface);border-radius:18px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{padding:12px 14px;text-align:right;white-space:nowrap;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--soft);border-top:0;font-size:13px}
th:first-child,td:first-child{text-align:left}
td.acc{color:var(--accent);font-weight:700}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
.me{color:var(--soft);font-weight:400}

/* settings */
.prod{background:var(--surface);border-radius:18px;padding:16px}
.prod+.prod{margin-top:10px}
.prod.off{opacity:.55}
.prod-name{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 0;outline:none;font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:24px;color:var(--ink)}
.prod-ro{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.prod-ro:first-child{border-top:0}
.prod-ro b{font-weight:600}
.prod-ro span{color:var(--soft);font-size:14px;text-align:right}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--soft);margin:0 0 6px}
.field{display:block;margin-bottom:14px}
.field:last-child{margin-bottom:0}
.prod-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--soft)}
.panel{background:var(--surface);border-radius:18px;padding:16px}

/* nav & fab */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav-in button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 5px;color:var(--soft);font-size:12px;font-weight:500}
.nav-in button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav-in button i{display:block;width:22px;height:3px;border-radius:2px;background:transparent}
.nav-in button[aria-current="page"] i{background:var(--pink)}
#fab{position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));pointer-events:none;left:0;display:flex;justify-content:flex-end;max-width:calc(600px + (100vw - 600px)/2)}
.fab{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:14px 20px 14px 16px;border-radius:99px;background:var(--fab-bg);color:var(--fab-fg);font-weight:700;font-size:16px;box-shadow:0 10px 24px rgba(0,0,0,.28)}
.savebar{position:fixed;z-index:35;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar .btn{max-width:568px;margin:0 auto;box-shadow:0 10px 24px rgba(0,0,0,.2)}
#toast{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}

/* sheet */
.overlay{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:26px 26px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;outline:none}
@keyframes up{from{transform:translateY(36px);opacity:0}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 12px}
.sh-h h2{margin:0;font-family:var(--f-display);font-stretch:68%;font-weight:900;font-size:32px;line-height:1;text-transform:uppercase}
.sh-x{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center}
.sh-b{overflow-y:auto;padding:0 20px 20px;flex:1;min-height:0}
.sh-f{background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.prow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:10px 10px 10px 14px}
.prow+.prow{margin-top:8px}
.prow .rt span{font-size:12px}
.step{display:flex;align-items:center;gap:4px;flex-shrink:0}
.step button{width:40px;height:40px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center}
.step input{width:56px;height:40px;border:0;border-radius:12px;text-align:center;font-family:var(--f-display);font-stretch:70%;font-weight:800;font-size:24px;background:var(--bg);color:var(--ink);outline:none}
.step input.on{background:var(--ink);color:var(--bg)}
.ofoot{display:flex;align-items:center;gap:12px}
.ofoot .sum{flex:1;min-width:0}
.ofoot .sum b{display:block;font-family:var(--f-display);font-stretch:68%;font-weight:900;font-size:32px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.ofoot .sum span{display:block;font-size:13px;color:var(--soft);margin-top:4px;overflow-wrap:anywhere}
.ofoot .btn{width:auto;padding:16px 22px;flex-shrink:0}
.sel{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;font-size:16px;color:var(--ink);min-height:48px}
.gate{background:var(--surface);border-radius:20px;padding:22px;margin-top:8px}

const monthLabel = k => { const a=k.split('-').map(Number); return new Date(a[0],a[1]-1,1).toLocaleDateString(loc(),{month:'long',year:'numeric'}); };
const monthName = k => { const a=k.split('-').map(Number); return new Date(a[0],a[1]-1,1).toLocaleDateString(loc(),{month:'long'}); };
const fmtDate = (s,long) => s ? parseISO(s).toLocaleDateString(loc(), long?{weekday:'short',month:'short',day:'numeric'}:{month:'short',day:'numeric'}) : '';
function relDay(s){ const n=daysBetween(todayISO(),s); if(n===0) return t('today'); if(n===1) return t('tomorrow'); if(n===-1) return t('overdue1'); if(n<0) return t('overdueN',{n:-n}); return t('inN',{n:n,d:fmtDate(s,true)}); }
const num = v => { const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isFinite(n)?n:0; };
const cur = () => S.catalog.currency||'Ft';
const nf = n => Math.round(n||0).toLocaleString(loc());
const money = n => nf(n)+' '+cur();
const totalsOf = o => (o.lines||[]).reduce((a,l)=>({qty:a.qty+l.qty,net:a.net+l.qty*l.price,commission:a.commission+l.qty*l.commission}),{qty:0,net:0,commission:0});
const sumTotals = os => os.reduce((a,o)=>{ const x=totalsOf(o); return {qty:a.qty+x.qty,net:a.net+x.net,commission:a.commission+x.commission}; },{qty:0,net:0,commission:0});
const lastOrderMap = os => { const m={}; os.forEach(o=>{ if(!m[o.clientId]||o.date>m[o.clientId]) m[o.clientId]=o.date; }); return m; };
const byName = (a,b) => a.name.localeCompare(b.name, loc());

/* ---------- state ---------- */
const S = {
  phase:'loading', loaded:false, db:null, user:null, uid:null, isAdmin:false, readonly:false,
  clients:{}, orders:{}, settings:{target:150000, reorderDays:21},
  catalog:DEFAULT_CATALOG,
  tab:'home', clientId:null, sheet:null,
  cf:{q:'',type:'All',stage:'all'}, om:monthKey(todayISO()), of:'all', tm:monthKey(todayISO()),
  team:{ids:[],data:{},names:{}}, members:{},
  pending:0, saveErr:false, deferred:false,
  draft:null, touched:false
};
const clientsArr = () => Object.values(S.clients);
const ordersArr = () => Object.values(S.orders);

/* ---------- persistence ---------- */
let chain = Promise.resolve();
function persist(fn, own){
  S.pending++; paintStatus();
  const run = async () => {
    try { await fn(); }
    catch(e){
      if(e && e.code==='unavailable'){ await new Promise(r=>setTimeout(r,400+Math.random()*500)); await fn(); }
      else throw e;
    }
  };
  chain = chain.catch(()=>{}).then(run).then(()=>{ S.saveErr=false; }, e=>{
    S.saveErr=true;
    const code = e && e.code;
    if(code==='invalid_argument' && own){ if(!S.readonly){ S.readonly=true; render(); } }
    else toast(code==='quota_exceeded'?t('quota'):t('save_failed'));
  }).finally(()=>{ S.pending--; paintStatus(); });
  return chain;
}
const myCol = () => S.db.collection('data/users/'+S.uid);
const putDoc = (id, body) => persist(()=>myCol().doc(id).set(body), true);
const delDoc = id => persist(()=>myCol().doc(id).delete(), true);
const clone = o => JSON.parse(JSON.stringify(o));

function statusHTML(){
  if(S.phase!=='ready') return '';
  if(S.pending>0) return tx('saving');
  if(S.saveErr) return tx('not_saved');
  return ic('check')+tx('saved');
}
function paintStatus(){ document.querySelectorAll('.status').forEach(el=>{ el.innerHTML=statusHTML(); el.classList.toggle('err', S.saveErr && !S.pending); }); }

let toastTimer;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(()=>{el.hidden=true;},2600); }

/* ---------- rendering ---------- */
function inMainField(){ const a=document.activeElement; return a && a.closest && a.closest('#main') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); }
function scheduleRender(){ if(inMainField()){ S.deferred=true; return; } render(); }
document.addEventListener('focusout', ()=>{ if(!S.deferred) return; setTimeout(()=>{ if(!inMainField()){ S.deferred=false; render(); } },0); });

function render(){
  document.documentElement.lang = lang;
  const main = document.getElementById('main');
  let html;
  if(S.phase==='signedout') html = header(t('nav_home'),'')+'<div class="gate"><h2>'+tx('signin_title')+'</h2><p>'+tx('signin_body')+'</p></div>';
  else {
    const c = S.clientId && S.clients[S.clientId];
    if(S.clientId && !c && S.loaded) S.clientId=null;
    html = c ? viewClient(c) : S.tab==='clients' ? viewClients() : S.tab==='orders' ? viewOrders() : S.tab==='team' && S.isAdmin ? viewTeam() : S.tab==='settings' ? viewSettings() : viewHome();
    if(S.readonly) html = '<div class="banner"><b>'+tx('readonly_title')+'</b>'+tx('readonly_body')+'</div>'+html;
  }
  main.innerHTML = html;
  renderNav(); renderFab(); renderSavebar(); paintStatus();
}

function header(title, sub, right){
  return '<header class="hdr"><div class="hdr-txt"><div class="brand">FREEZBEE</div><h1>'+esc(title)+'</h1>'+(sub?'<p class="sub">'+esc(sub)+'</p>':'')+'</div><div class="hdr-r"><span class="status"></span>'+(right||'')+'</div></header>';
}
function section(title, body, aside){ return '<section class="sec"><div class="sec-h"><h2>'+esc(title)+'</h2>'+(aside?'<span class="aside">'+aside+'</span>':'')+'</div>'+body+'</section>'; }
function stageBadge(id){ return '<span class="badge" style="--c:var(--st-'+id+')">'+tx('st_'+id)+'</span>'; }
function callLink(c){ if(!c.phone) return ''; return '<a class="callbtn tap" href="tel:'+esc(c.phone.replace(/[^\d+]/g,''))+'" aria-label="'+tx('call')+' '+esc(c.name)+'">'+ic('phone')+'</a>'; }
function clientRow(c, sub, subCls, right){
  return '<div class="row"><button class="row-main tap" data-act="open-client" data-id="'+esc(c.id)+'"><span class="avatar">'+typeIcon(c.type)+'</span><span class="rt"><b>'+esc(c.name)+'</b>'+(sub?'<span class="'+(subCls||'')+'">'+esc(sub)+'</span>':'')+'</span></button>'+(right||'')+'</div>';
}
function productName(l){ const p=S.catalog.products.find(x=>x.id===l.pizzaId); return p?p.name:(l.name||'?'); }
function orderRow(o, showClient){
  const tt=totalsOf(o); const c=S.clients[o.clientId];
  const breakdown=(o.lines||[]).filter(l=>l.qty>0).map(l=>l.qty+' '+productName(l)).join(', ');
  const title = showClient ? (c?c.name:'—') : fmtDate(o.date,true);
  const sub1 = showClient ? fmtDate(o.date)+': '+breakdown : breakdown;
  return '<div class="orow"><button class="orow-main tap" data-act="open-order" data-id="'+esc(o.id)+'"><b>'+esc(title)+'</b><span>'+esc(sub1)+'</span><span>'+tx('pieces_net',{n:nf(tt.qty),v:money(tt.net)})+'</span></button>'+
    '<div class="orow-r"><span class="earn">+'+esc(money(tt.commission))+'</span><button class="paid tap '+(o.paid?'yes':'no')+'" data-act="toggle-paid" data-id="'+esc(o.id)+'" aria-pressed="'+(o.paid?'true':'false')+'">'+tx(o.paid?'paid_out':'unpaid')+'</button></div></div>';
}

/* --- Today --- */
function viewHome(){
  const today=todayISO(), mk=monthKey(today);
  const clients=clientsArr(), orders=ordersArr();
  const mo=orders.filter(o=>monthKey(o.date)===mk);
  const tt=sumTotals(mo);
  const target=num(S.settings.target);
  const pct = target>0 ? Math.min(100,Math.round(tt.commission/target*100)) : 0;
  const unpaid=sumTotals(orders.filter(o=>!o.paid)).commission;
  // product mix
  const mixMap={}; mo.forEach(o=>(o.lines||[]).forEach(l=>{ mixMap[l.pizzaId]=(mixMap[l.pizzaId]||0)+l.qty; }));
  const mix=S.catalog.products.filter(p=>p.active!==false||mixMap[p.id]).map(p=>({name:p.name,qty:mixMap[p.id]||0}));
  Object.keys(mixMap).forEach(id=>{ if(!S.catalog.products.some(p=>p.id===id)){ const l=mo.flatMap(o=>o.lines||[]).find(x=>x.pizzaId===id); mix.push({name:l?l.name:id,qty:mixMap[id]}); } });

  let h = header(t('nav_home'), new Date().toLocaleDateString(loc(),{weekday:'long',month:'long',day:'numeric'}));
  if(S.phase==='loading' || (S.phase==='ready' && !S.loaded)) h += '<p class="note" style="margin:0 4px 12px">'+tx('loading')+'</p>';
  else if(S.phase==='ready' && clients.length===0) h += '<div class="start"><h2>'+tx('start_title')+'</h2><p>'+tx('start_body')+'</p><button class="btn btn-ink tap" data-act="add-client">'+ic('plus')+tx('add_client')+'</button></div>';

  h += '<section class="ticket" aria-label="'+tx('commission_in',{m:monthName(mk)})+'"><div class="t-top"><p class="t-lbl">'+tx('commission_in',{m:monthName(mk)})+'</p><p class="t-big">'+esc(money(tt.commission))+'</p>';
  if(target>0) h += '<div class="bar"><i style="width:'+pct+'%"></i></div><div class="bar-txt"><span>'+tx('goal_pct',{p:pct,g:money(target)})+'</span><span>'+(tt.commission>=target?tx('goal_reached'):tx('to_go',{v:money(target-tt.commission)}))+'</span></div>';
  h += '</div><div class="perf"></div><div class="t-bot"><div class="t-stats">'+
    '<div class="t-stat"><b>'+nf(tt.qty)+'</b><span>'+tx('pizzas_sold')+'</span></div>'+
    '<div class="t-stat"><b>'+esc(money(tt.net))+'</b><span>'+tx('net_sales')+'</span></div>'+
    '<div class="t-stat"><b>'+esc(money(unpaid))+'</b><span>'+tx('not_paid')+'</span></div></div>';
  h += '<div class="mix">'+(tt.qty>0?mix.map((p,i)=>p.qty>0?'<i style="width:'+(p.qty/tt.qty*100)+'%;opacity:'+MIX_OP[i%MIX_OP.length]+'"></i>':'').join(''):'')+'</div>';
  h += '<div class="legend">'+mix.map((p,i)=>'<div><span class="dot" style="opacity:'+MIX_OP[i%MIX_OP.length]+'"></span><span class="nm">'+esc(p.name)+'</span><b>'+nf(p.qty)+'</b></div>').join('')+'</div></div></section>';

  const fus=clients.filter(c=>c.stage!=='lost'&&c.nextFollowUp&&c.nextFollowUp<=addDays(today,7)).sort((a,b)=>a.nextFollowUp.localeCompare(b.nextFollowUp)).slice(0,10);
  h += section(t('followups'), fus.length ? '<div class="card">'+fus.map(c=>clientRow(c, relDay(c.nextFollowUp), c.nextFollowUp<today?'late':c.nextFollowUp===today?'soon':'', callLink(c))).join('')+'</div>' : '<div class="empty">'+tx('followups_empty')+'</div>');

  const lo=lastOrderMap(orders);
  const re=clients.filter(c=>c.stage==='customer'&&lo[c.id]&&daysBetween(lo[c.id],today)>=num(S.settings.reorderDays||21)).map(c=>({c:c,d:daysBetween(lo[c.id],today)})).sort((a,b)=>b.d-a.d).slice(0,8);
  if(re.length) h += section(t('reorder_due'), '<div class="card">'+re.map(x=>clientRow(x.c, t('last_order_ago',{n:x.d}), '', callLink(x.c))).join('')+'</div>');

  const bc={}; mo.forEach(o=>{ bc[o.clientId]=(bc[o.clientId]||0)+totalsOf(o).commission; });
  const top=Object.keys(bc).map(id=>({c:S.clients[id],v:bc[id]})).filter(x=>x.c).sort((a,b)=>b.v-a.v).slice(0,5);
  if(top.length) h += section(t('best_clients'), '<div class="card">'+top.map(x=>clientRow(x.c, x.c.city||t('type_'+x.c.type), '', '<span class="earn">+'+esc(money(x.v))+'</span>')).join('')+'</div>');

  if(clients.length) h += section(t('pipeline'), '<div class="pipe">'+STAGES.map(s=>'<button class="tap" style="--c:var(--st-'+s+')" data-act="go-stage" data-stage="'+s+'"><b>'+clients.filter(c=>c.stage===s).length+'</b><span>'+tx('st_'+s)+'</span></button>').join('')+'</div>');
  return h;
}

/* --- Clients --- */
function filteredClients(){
  const q=S.cf.q.trim().toLowerCase();
  return clientsArr().filter(c=>S.cf.type==='All'||c.type===S.cf.type).filter(c=>S.cf.stage==='all'||c.stage===S.cf.stage)
    .filter(c=>!q||[c.name,c.city,c.contact,c.phone].filter(Boolean).join(' ').toLowerCase().indexOf(q)>=0).sort(byName);
}
function clientListHTML(){
  const all=clientsArr(); const list=filteredClients(); const today=todayISO();
  if(!list.length) return '<div class="empty">'+tx(all.length?'clients_nomatch':'clients_empty')+'</div>';
  return '<div class="card">'+list.map(c=>{
    const due=c.nextFollowUp&&c.nextFollowUp<=today&&c.stage!=='lost';
    const sub=due?t('followup_prefix',{r:relDay(c.nextFollowUp)}):([c.city,c.contact].filter(Boolean).join(', ')||t('type_'+c.type));
    return clientRow(c, sub, due?'late':'', stageBadge(c.stage));
  }).join('')+'</div>';
}
function viewClients(){
  const all=clientsArr(); const buying=all.filter(c=>c.stage==='customer').length;
  let h=header(t('nav_clients'), all.length?t('clients_sub',{n:all.length,b:buying}):t('no_clients_yet'), S.phase==='ready'?'<button class="pill pill-ink tap" data-act="add-client">'+ic('plus')+tx('add_client')+'</button>':'');
  h += '<div class="search">'+ic('search')+'<input id="q" type="search" value="'+esc(S.cf.q)+'" placeholder="'+tx('search_ph')+'" aria-label="'+tx('search_ph')+'" autocomplete="off"></div>';
  h += '<div class="chips scroll" style="margin-top:12px">'+['All'].concat(TYPES).map(ty=>'<button class="chip tap" data-act="f-type" data-v="'+ty+'" aria-pressed="'+(S.cf.type===ty)+'">'+(ty==='All'?tx('all_types'):tx('type_'+ty))+'</button>').join('')+'</div>';
  h += '<div class="chips scroll" style="margin-top:8px">'+['all'].concat(STAGES).map(s=>'<button class="chip tap" data-act="f-stage" data-v="'+s+'" aria-pressed="'+(S.cf.stage===s)+'"'+(s!=='all'?' style="--c:var(--st-'+s+')"':'')+'>'+(s==='all'?tx('all_stages'):tx('st_'+s))+'</button>').join('')+'</div>';
  h += '<div id="clist" style="margin-top:16px">'+clientListHTML()+'</div>';
  return h;
}

/* --- Client detail --- */
function viewClient(c){
  const today=todayISO();
  const orders=ordersArr().filter(o=>o.clientId===c.id).sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0));
  const tt=sumTotals(orders);
  const place=[c.address,c.city].filter(Boolean).join(', ');
  let h='<div class="back-row"><button class="back tap" data-act="back">'+ic('left')+tx('back')+'</button><div style="display:flex;align-items:center;gap:10px"><span class="status"></span><button class="pill tap" data-act="edit-client">'+ic('pencil')+tx('edit')+'</button></div></div>';
  h+='<div class="cd-meta">'+typeIcon(c.type)+'<span>'+esc([t('type_'+c.type),c.city].filter(Boolean).join(', '))+'</span></div>';
  h+='<h1 class="cd-name">'+esc(c.name)+'</h1>';
  if(c.contact) h+='<div class="cd-contact">'+esc(c.contact)+'</div>';
  if(c.phone||c.email||place){
    h+='<div class="contact-list">';
    if(c.phone) h+='<div class="cline"><span class="val num">'+esc(c.phone)+'</span><button class="mini tap" data-act="copy" data-text="'+esc(c.phone)+'">'+tx('copy')+'</button><a class="mini go tap" href="tel:'+esc(c.phone.replace(/[^\d+]/g,''))+'">'+tx('call')+'</a></div>';
    if(c.email) h+='<div class="cline"><span class="val">'+esc(c.email)+'</span><button class="mini tap" data-act="copy" data-text="'+esc(c.email)+'">'+tx('copy')+'</button><a class="mini tap" href="mailto:'+esc(c.email)+'">'+tx('email')+'</a></div>';
    if(place) h+='<div class="cline"><span class="val">'+esc(place)+'</span><a class="mini tap" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(place)+'">'+tx('directions')+'</a></div>';
    h+='</div>';
  }
  h+='<div style="margin-top:18px" class="stats3"><div><b>'+nf(tt.qty)+'</b><span>'+tx('pieces_bought')+'</span></div><div><b>'+esc(money(tt.net))+'</b><span>'+tx('net_sales')+'</span></div><div><b class="acc">'+esc(money(tt.commission))+'</b><span>'+tx('your_commission')+'</span></div></div>';
  h+='<div class="grid2" style="margin-top:10px"><button class="btn btn-ink tap" data-act="log-order" data-client="'+esc(c.id)+'">'+ic('plus')+tx('log_order')+'</button><button class="btn btn-plain tap" data-act="log-activity">'+ic('plus')+tx('log_activity')+'</button></div>';

  h+=section(t('stage'), '<div class="chips scroll">'+STAGES.map(s=>'<button class="chip tap" style="--c:var(--st-'+s+')" data-act="set-stage" data-v="'+s+'" aria-pressed="'+(c.stage===s)+'">'+tx('st_'+s)+'</button>').join('')+'</div>');

  const fu=c.nextFollowUp; const late=fu&&fu<today;
  let f='<div class="fu"><div class="fu-top">'+ic('cal')+'<div class="rt"><b>'+(fu?esc(fmtDate(fu,true)):tx('not_set'))+'</b>'+(fu?'<span class="'+(late?'late':'')+'">'+esc(relDay(fu))+'</span>':'')+'</div>'+(fu?'<button class="mini-btn tap" data-act="fu-clear">'+tx('clear')+'</button>':'')+'</div>';
  f+='<div class="chips" style="margin-top:12px">'+[['tomorrow',1],['in3',3],['next_week',7],['in2w',14]].map(x=>'<button class="chip tap" data-act="fu-quick" data-d="'+x[1]+'">'+tx(x[0])+'</button>').join('')+'</div>';
  f+='<input id="fu-date" class="input" type="date" style="margin-top:12px" value="'+esc(fu||'')+'" aria-label="'+tx('pick_date')+'"></div>';
  h+=section(t('next_followup'), f);

  h+=section(t('orders'), orders.length?'<div class="card">'+orders.map(o=>orderRow(o,false)).join('')+'</div>':'<div class="empty">'+tx('orders_empty_client',{n:c.name})+'</div>', orders.length?tx('last_on',{d:fmtDate(orders[0].date)}):'');

  const acts=(c.activities||[]).slice().sort((a,b)=>b.date.localeCompare(a.date));
  h+=section(t('activity'), acts.length?'<div class="card">'+acts.map(a=>'<div class="act"><div class="rt"><b>'+tx('act_'+a.type)+' <span style="display:inline;color:var(--soft);font-weight:400;font-size:14px">'+esc(fmtDate(a.date))+'</span></b>'+(a.text?'<div class="txt">'+esc(a.text)+'</div>':'')+'</div><button class="x tap" data-act="del-activity" data-id="'+esc(a.id)+'" aria-label="'+tx('clear')+'">'+ic('x')+'</button></div>').join('')+'</div>':'<div class="empty">'+tx('activity_empty')+'</div>');
  if(c.notes) h+=section(t('notes'), '<div class="panel" style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(c.notes)+'</div>');
  h+='<div class="sec"><button class="btn btn-danger tap" data-act="del-client" data-confirm="'+tx('delete_client_confirm')+'">'+tx('delete_client')+'</button></div>';
  return h;
}

/* --- Team --- */
function viewTeam(){
  let h=header(t('nav_team'), t('team_sub'));
  h+='<div class="monthnav"><button class="tap" data-act="tm" data-d="-1" aria-label="‹">'+ic('left')+'</button><span>'+esc(monthLabel(S.tm))+'</span><button class="tap" data-act="tm" data-d="1" aria-label="›">'+ic('right')+'</button></div>';
  const ids=S.team.ids;
  if(!ids.length) return h+'<div class="empty" style="margin-top:12px">'+tx('team_empty')+'</div>'+membersSection();
  const rows=ids.map(id=>{
    const d=S.team.data[id]||{clients:0,orders:[]};
    const mo=d.orders.filter(o=>monthKey(o.date)===S.tm);
    const tt=sumTotals(mo); const up=sumTotals(mo.filter(o=>!o.paid)).commission;

function orderProducts(){
  const s=S.sheet; const list=S.catalog.products.filter(p=>p.active!==false).map(p=>{

}

function goTop(){ try{ window.scrollTo(0,0); }catch(e){} }

const A = {
  nav(el){ S.clientId=null; S.tab=el.dataset.tab; if(S.tab==='team') resolveNames(); render(); goTop(); },
  'open-client'(el){ S.clientId=el.dataset.id; render(); goTop(); },
  back(){ S.clientId=null; render(); goTop(); },
  'add-client'(){ S.sheet={kind:'client',f:blankClient()}; renderSheet(); },
  'edit-client'(){ const c=S.clients[S.clientId]; S.sheet={kind:'client',id:c.id,f:Object.assign(blankClient(),clone(c))}; renderSheet(); },
  'log-order'(el){ S.sheet={kind:'order',clientId:el.dataset.client||'',date:todayISO(),note:'',qty:{}}; renderSheet(); },
  'open-order'(el){ const o=S.orders[el.dataset.id]; if(!o) return; const q={}; (o.lines||[]).forEach(l=>{q[l.pizzaId]=l.qty;}); S.sheet={kind:'order',id:o.id,clientId:o.clientId,date:o.date,note:o.note||'',qty:q,oldLines:clone(o.lines||[]),paid:!!o.paid,createdAt:o.createdAt}; renderSheet(); },
  'log-activity'(){ const c=S.clients[S.clientId]; const today=todayISO(); S.sheet={kind:'activity',clientId:c.id,type:'call',date:today,text:'',follow:(c.nextFollowUp&&c.nextFollowUp>today)?c.nextFollowUp:''}; renderSheet(); },
  'close-sheet'(){ closeSheet(); },
  overlay(el,e){ if(e.target===el) closeSheet(); },
  chip(el){
    const g=el.parentElement.dataset.group; const v=el.dataset.v; const s=S.sheet; if(!s) return;
    if(s.kind==='client') s.f[g]=v; else if(s.kind==='activity'){ if(g==='type') s.type=v; else { s.follow=v; const inp=document.getElementById('a-follow'); if(inp) inp.value=v; } }
    el.parentElement.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed', b===el?'true':'false'));
  },
  'save-client'(){
    const s=S.sheet; const g=id=>document.getElementById(id).value.trim();
    const name=g('cf-name'); if(!name){ toast(t('name_required')); document.getElementById('cf-name').focus(); return; }
    const old=s.id?S.clients[s.id]:null;
    const id=s.id||rid('c_');
    const body={kind:'client',id:id,name:name,type:s.f.type,contact:g('cf-contact'),phone:g('cf-phone'),email:g('cf-email'),address:g('cf-address'),city:g('cf-city'),stage:s.f.stage,nextFollowUp:document.getElementById('cf-fu').value||'',notes:document.getElementById('cf-notes').value.trim(),activities:old?clone(old.activities||[]):[],createdAt:old?old.createdAt:Date.now()};
    S.clients[id]=body; putDoc(id, body); closeSheet();
    if(!s.id){ S.clientId=id; goTop(); }
    render();
  },
  step(el){ const s=S.sheet; const p=el.dataset.p; s.qty[p]=Math.max(0,Math.min(99999,(s.qty[p]||0)+Number(el.dataset.d))); const inp=document.querySelector('[data-qty="'+CSS.escape(p)+'"]'); if(inp){ inp.value=s.qty[p]||''; inp.classList.toggle('on',!!s.qty[p]); } refreshOrderFoot(); },
  'save-order'(){
    const s=S.sheet; const lines=orderLines(); if(!s.clientId||!s.date||!lines.length) return;
    const id=s.id||rid('o_');
    const body={kind:'order',id:id,clientId:s.clientId,date:s.date,note:(s.note||'').trim(),paid:!!s.paid,createdAt:s.createdAt||Date.now(),lines:lines};
    S.orders[id]=body; putDoc(id, body);
    const c=S.clients[s.clientId]; if(c && c.stage!=='customer'){ const nc=Object.assign(clone(c),{stage:'customer'}); S.clients[c.id]=nc; putDoc(c.id, nc); }
    closeSheet(); render();
  },
  'del-order'(){ const id=S.sheet.id; delete S.orders[id]; delDoc(id); closeSheet(); render(); },
  'save-activity'(){
    const s=S.sheet; const c=S.clients[s.clientId]; if(!c) return closeSheet();
    const act={id:rid('a_'),type:s.type,date:document.getElementById('a-date').value||todayISO(),text:document.getElementById('a-text').value.trim()};
    let stage=c.stage;
    if(s.type==='tasting'&&(stage==='lead'||stage==='contacted')) stage='tasting';
    else if(s.type!=='note'&&stage==='lead') stage='contacted';
    const follow=document.getElementById('a-follow').value||'';
    closeSheet();
    patchClient(c.id,{stage:stage,nextFollowUp:follow,activities:[act].concat(c.activities||[])});
  },
  'del-activity'(el){ const c=S.clients[S.clientId]; patchClient(c.id,{activities:(c.activities||[]).filter(a=>a.id!==el.dataset.id)}); },
  'set-stage'(el){ patchClient(S.clientId,{stage:el.dataset.v}); },
  'fu-quick'(el){ patchClient(S.clientId,{nextFollowUp:addDays(todayISO(),Number(el.dataset.d))}); },
  'fu-clear'(){ patchClient(S.clientId,{nextFollowUp:''}); },
  async 'del-client'(){
    const id=S.clientId; const ods=ordersArr().filter(o=>o.clientId===id).map(o=>o.id);
    delete S.clients[id]; ods.forEach(o=>delete S.orders[o]); S.clientId=null; render(); goTop();
    delDoc(id); ods.forEach(o=>delDoc(o));
  },
  'toggle-paid'(el){ const o=S.orders[el.dataset.id]; if(!o) return; const n=Object.assign(clone(o),{paid:!o.paid}); S.orders[o.id]=n; render(); putDoc(o.id,n); },
  'mark-all-paid'(){ ordersArr().filter(o=>monthKey(o.date)===S.om&&!o.paid).forEach(o=>{ const n=Object.assign(clone(o),{paid:true}); S.orders[o.id]=n; putDoc(o.id,n); }); render(); },
  'f-type'(el){ S.cf.type=el.dataset.v; render(); },
  'f-stage'(el){ S.cf.stage=el.dataset.v; render(); },
  'go-stage'(el){ S.cf={q:'',type:'All',stage:el.dataset.stage}; S.tab='clients'; render(); goTop(); },
  om(el){ S.om=shiftMonth(S.om,Number(el.dataset.d)); render(); },
  of(el){ S.of=el.dataset.v; render(); },
  tm(el){ S.tm=shiftMonth(S.tm,Number(el.dataset.d)); render(); },
  lang(el){ lang=el.dataset.v; try{ localStorage.setItem('fz-lang',lang); }catch(e){} render(); renderSheet(); },
  'prod-add'(){ S.draft.products.push({id:rid('p_'),name:'',price:'',commission:'',active:true}); S.touched=true; render(); const i=S.draft.products.length-1; const el=document.getElementById('p-name-'+i); if(el) el.focus(); },
  'prod-toggle'(el){ const p=S.draft.products[Number(el.dataset.i)]; p.active=!p.active; S.touched=true; render(); },
  'save-settings'(){
    const d=S.draft;
    const ns={kind:'settings',target:Math.max(0,num(d.target)),reorderDays:Math.max(1,Math.round(num(d.reorderDays))||21)};
    if(ns.target!==S.settings.target||ns.reorderDays!==S.settings.reorderDays){ S.settings=Object.assign({},S.settings,ns); putDoc('settings',ns); }
    if(S.isAdmin){
      const cat={currency:cur(),vat:Math.max(0,num(d.vat)),products:d.products.map(p=>({id:p.id,name:p.name.trim()||t('new_product'),price:Math.max(0,num(p.price)),commission:Math.max(0,num(p.commission)),active:!!p.active}))};
      if(JSON.stringify(cat)!==JSON.stringify({currency:cur(),vat:S.catalog.vat,products:S.catalog.products.map(p=>({id:p.id,name:p.name,price:p.price,commission:p.commission,active:p.active!==false}))})){
        S.catalog=cat; persist(()=>S.db.doc('catalog/products').set(cat), false);
      }
    }
    S.touched=false; toast(t('changes_saved')); render();
  },
  copy(el){
    const text=el.dataset.text;
    const done=()=>{ el.textContent=t('copied'); setTimeout(()=>{ el.textContent=t('copy'); },1500); };
    try{ navigator.clipboard.writeText(text).then(done,()=>selectSibling(el)); }catch(e){ selectSibling(el); }
  },
  export(el){ exportCSV(el.dataset.kind); },
  'add-member'(){ S.sheet={kind:'member',f:{name:'',email:'',phone:'',position:'',segment:'',uid:''}}; renderSheet(); },
  'open-member'(el){ const m=S.members[el.dataset.id]; if(!m) return; S.sheet={kind:'member',id:m.id,f:Object.assign({name:'',email:'',phone:'',position:'',segment:'',uid:''},clone(m))}; renderSheet(); },
  'save-member'(){
    const s=S.sheet; const g=id=>document.getElementById(id).value.trim();
    const name=g('mf-name'); if(!name){ toast(t('m_name_required')); document.getElementById('mf-name').focus(); return; }
    const id=s.id||rid('m_');
    const old=s.id?S.members[s.id]:null;
    const body={id:id,name:name,email:g('mf-email'),phone:g('mf-phone'),position:g('mf-position'),segment:g('mf-segment'),uid:document.getElementById('mf-uid').value||'',createdAt:old?old.createdAt:Date.now()};
    S.members[id]=body; persist(()=>S.db.collection('members').doc(id).set(body), false);
    closeSheet(); render();
  },
  'del-member'(){ const id=S.sheet.id; delete S.members[id]; persist(()=>S.db.collection('members').doc(id).delete(), false); closeSheet(); render(); }
};
function selectSibling(el){ const v=el.parentElement.querySelector('.val'); if(!v) return; const r=document.createRange(); r.selectNodeContents(v); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  if(a==='overlay'){ A.overlay(el,e); return; }
  if(el.dataset.confirm && !el.classList.contains('armed')){
    const orig=el.textContent; el.classList.add('armed'); el.textContent=el.dataset.confirm;
    setTimeout(()=>{ if(el.isConnected){ el.classList.remove('armed'); el.textContent=orig; } },4000);
    return;
  }
  if(A[a]) A[a](el,e);
});
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.id==='q'){ S.cf.q=el.value; const l=document.getElementById('clist'); if(l) l.innerHTML=clientListHTML(); return; }
  if(el.dataset.qty!=null && S.sheet){ const v=parseInt(el.value.replace(/\D/g,''),10)||0; S.sheet.qty[el.dataset.qty]=Math.min(99999,v); el.classList.toggle('on',v>0); refreshOrderFoot(); return; }
  if(el.id==='o-date' && S.sheet){ S.sheet.date=el.value; refreshOrderFoot(); return; }
  if(el.id==='o-note' && S.sheet){ S.sheet.note=el.value; return; }
  if(el.dataset.draft && S.draft){ S.draft[el.dataset.draft]=el.value; markTouched(); return; }
  if(el.dataset.prod!=null && S.draft){ S.draft.products[Number(el.dataset.prod)][el.dataset.field]=el.value; markTouched(); return; }
});
function markTouched(){ if(!S.touched){ S.touched=true; renderSavebar(); } }
document.addEventListener('change', e=>{
  const el=e.target;
  if(el.id==='o-client' && S.sheet){ S.sheet.clientId=el.value; refreshOrderFoot(); return; }
  if(el.id==='o-date' && S.sheet){ S.sheet.date=el.value; refreshOrderFoot(); return; }
  if(el.id==='a-follow' && S.sheet){ S.sheet.follow=el.value; const g=document.querySelector('[data-group="follow"]'); if(g) g.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed', b.dataset.v===el.value?'true':'false')); return; }
  if(el.id==='fu-date' && S.clientId){ el.blur(); patchClient(S.clientId,{nextFollowUp:el.value||''}); return; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.sheet) closeSheet(); });

/* ---------- export ---------- */
function csvCell(v){ const s=String(v==null?'':v); return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
async function exportCSV(kind){
  let dl=null; try{ dl=await window.claude.use('downloads'); }catch(e){}
  if(!dl){ toast(t('export_failed')); return; }
  const rows=[];
  if(kind==='orders'){
    rows.push(t('csv_orders'));
    ordersArr().sort((a,b)=>a.date.localeCompare(b.date)).forEach(o=>{ const c=S.clients[o.clientId]||{};
      (o.lines||[]).forEach(l=>rows.push([o.date,c.name||'',c.type?t('type_'+c.type):'',c.city||'',productName(l),l.qty,l.price,l.qty*l.price,l.commission,l.qty*l.commission,o.paid?t('yes'):t('no'),o.note||''].map(csvCell).join(';')));
    });
  } else {
    rows.push(t('csv_clients'));
    clientsArr().sort(byName).forEach(c=>{ const os=ordersArr().filter(o=>o.clientId===c.id); const tt=sumTotals(os);
      rows.push([c.name,t('type_'+c.type),t('st_'+c.stage),c.contact,c.phone,c.email,c.address,c.city,c.nextFollowUp,os.length,tt.qty,tt.net,tt.commission,c.notes].map(csvCell).join(';'));
    });
  }
  try{ await dl.save({filename:'freezbee-'+kind+'-'+todayISO()+'.csv',data:'﻿'+rows.join('\r\n')}); toast(t('exported')); }
  catch(e){ toast(e&&e.code==='declined'?t('export_declined'):t('export_failed')); }
}

/* ---------- team ---------- */
const teamSubs={};
function startTeam(){
  S.db.collection('team').onSnapshot(snap=>{
    const ids=snap.docs.map(d=>d.id).slice(0,50);
    ids.forEach(id=>{
      if(teamSubs[id]) return;
      teamSubs[id]=S.db.collection('data/users/'+id).onSnapshot(s=>{
        const os=[]; let n=0;
        s.docs.forEach(d=>{ const v=d.data(); if(!v) return; if(v.kind==='order') os.push(v); else if(v.kind==='client') n++; });
        S.team.data[id]={clients:n,orders:os}; if(S.tab==='team') scheduleRender();
      }, ()=>{});
    });
    Object.keys(teamSubs).forEach(id=>{ if(ids.indexOf(id)<0){ teamSubs[id](); delete teamSubs[id]; delete S.team.data[id]; } });
    S.team.ids=ids; resolveNames();
  }, ()=>{});
  S.db.collection('members').onSnapshot(snap=>{
    const m={}; snap.docs.forEach(d=>{ const v=d.data(); if(v) m[d.id]=Object.assign({},v,{id:d.id}); });
    S.members=m; if(S.tab==='team') scheduleRender();
  }, ()=>{});
}
async function resolveNames(){
  if(!S.user || !S.team.ids.length) return;
  try{ const ps=await S.user.profiles(S.team.ids); const m={}; S.team.ids.forEach(id=>{ m[id]={name:(ps[id]&&ps[id].name)||''}; }); S.team.names=m; }catch(e){}
  if(S.tab==='team') scheduleRender();
}

/* ---------- boot ---------- */
async function init(){
  if(!window.claude || typeof window.claude.use!=='function'){ S.phase='signedout'; render(); return; }
  let db=null, user=null;
  try{ const r=await Promise.all([window.claude.use('db'), window.claude.use('user')]); db=r[0]; user=r[1]; }catch(e){}
  S.db=db; S.user=user;
  const id = user ? await user.id() : null;
  if(!db || !id){ S.phase='signedout'; render(); return; }
  S.uid=id; S.isAdmin = await user.canEdit(); S.phase='ready';
  myCol().onSnapshot(snap=>{
    const c={}, o={}; let st=null;
    snap.docs.forEach(d=>{ const v=d.data(); if(!v) return; if(v.kind==='client') c[d.id]=Object.assign({},v,{id:d.id}); else if(v.kind==='order') o[d.id]=Object.assign({},v,{id:d.id}); else if(d.id==='settings') st=v; });
    S.clients=c; S.orders=o; if(st) S.settings=Object.assign({},S.settings,{target:st.target,reorderDays:st.reorderDays});
    S.loaded=true; scheduleRender();
  }, e=>{ if(e && e.code==='revoked'){ S.phase='signedout'; render(); } });
  S.db.doc('catalog/products').onSnapshot(s=>{
    const v=s.exists?s.data():null;
    if(v && Array.isArray(v.products) && v.products.length){ S.catalog={currency:v.currency||'Ft',vat:v.vat!=null?v.vat:27,products:v.products}; scheduleRender(); }
  }, ()=>{});
  S.db.doc('team/'+id).get().then(s=>{ if(!s.exists) return S.db.doc('team/'+id).set({joined:todayISO()}); }).catch(()=>{});
  if(S.isAdmin) startTeam();
  render();
}
render();
init();
})();
</script>
